<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess UI</title>
    <style>
        /* A6: Theme system — CSS custom properties on :root.
           Default = current light look (no visual regression for existing users).
           [data-theme=...] overrides square colors, background, panels, borders.
           [data-mode=dark] switches the page-level dark palette. */
        :root {
            --bg-page: #f0f0f0;
            --board-border: #333;
            --sq-white: #eeeed2;
            --sq-black: #769656;
            --highlight: #f7f769;
            --label-color: #333;
            --panel-bg: white;
            --panel-border: #ccc;
            --panel-row-border: #ddd;
            --modal-bg: white;
            --modal-border: #333;
            --card-bg: white;
            --card-border: #333;
            --text-color: inherit;
            --timer-border: #333;
            --active-timer-bg: #f7f769;
            --active-timer-border: #ffcc00;
            --drop-hint-bg: #bcd4ff;
            --overlay-bg: rgba(17, 24, 39, 0.7);
            /* A7: subtle depth tokens (theme-overridable) */
            --sq-white-grad: linear-gradient(145deg, rgba(255,255,255,0.18), rgba(0,0,0,0.06));
            --sq-black-grad: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(0,0,0,0.10));
            --piece-shadow: drop-shadow(0 2px 1.5px rgba(0,0,0,0.35));
            --board-bevel: inset 0 0 0 1px rgba(255,255,255,0.12),
                           inset 0 1px 2px rgba(255,255,255,0.18),
                           inset 0 -2px 4px rgba(0,0,0,0.25);
        }

        /* ---- Dark mode ---- */
        [data-mode="dark"] {
            --bg-page: #1a1a2e;
            --board-border: #0d0d1a;
            --label-color: #ccc;
            --panel-bg: #16213e;
            --panel-border: #0d1b2a;
            --panel-row-border: #1c2a4a;
            --modal-bg: #16213e;
            --modal-border: #456;
            --card-bg: #16213e;
            --card-border: #456;
            --text-color: #e0e0e0;
            --timer-border: #456;
            --overlay-bg: rgba(5, 5, 15, 0.85);
            /* A7: subtler depth on dark backgrounds */
            --sq-white-grad: linear-gradient(145deg, rgba(255,255,255,0.10), rgba(0,0,0,0.18));
            --sq-black-grad: linear-gradient(145deg, rgba(255,255,255,0.07), rgba(0,0,0,0.22));
            --piece-shadow: drop-shadow(0 2px 2px rgba(0,0,0,0.55));
            --board-bevel: inset 0 0 0 1px rgba(255,255,255,0.06),
                           inset 0 1px 2px rgba(255,255,255,0.10),
                           inset 0 -2px 5px rgba(0,0,0,0.45);
        }

        /* ---- Board theme: classic-dark (lichess green, dark page pairing) ---- */
        [data-theme="classic-dark"] {
            --sq-white: #ebecd0;
            --sq-black: #779556;
            --highlight: #f6f669;
        }

        /* ---- Board theme: slate ---- */
        [data-theme="slate"] {
            --sq-white: #c8d2dc;
            --sq-black: #6b7f8e;
            --highlight: #ffd54f;
        }

        /* ---- Board theme: walnut ---- */
        [data-theme="walnut"] {
            --sq-white: #e8d5b7;
            --sq-black: #8b5e3c;
            --highlight: #f0d77a;
            /* A7: warm depth for walnut */
            --sq-white-grad: linear-gradient(145deg, rgba(255,255,255,0.20), rgba(120,80,40,0.08));
            --sq-black-grad: linear-gradient(145deg, rgba(255,220,180,0.14), rgba(60,30,10,0.16));
        }

        /* ---- Colorblind-safe palette (light) ---- */
        [data-theme="colorblind"] {
            --sq-white: #f2f2f2;
            --sq-black: #b0b0b0;
            --highlight: #ff8c00;
            --board-border: #555;
        }

        /* ---- Colorblind-safe palette (dark) ---- */
        [data-theme="colorblind-dark"] {
            --sq-white: #2a2a2a;
            --sq-black: #555555;
            --highlight: #ff8c00;
            --board-border: #444;
            /* A7: subtle depth for grayscale squares */
            --sq-white-grad: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(0,0,0,0.20));
            --sq-black-grad: linear-gradient(145deg, rgba(255,255,255,0.06), rgba(0,0,0,0.16));
        }

        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--bg-page);
            color: var(--text-color);
        }
        #game-container {
            margin-top: 20px;
        }
        #board {
            display: grid;
            width: min(calc(100vw - 2.5em), 640px);
            aspect-ratio: 1;
            grid-template-columns: repeat(8, minmax(0, 1fr));
            grid-template-rows: repeat(8, minmax(0, 1fr));
            border: 2px solid var(--board-border);
            box-shadow: var(--board-bevel);
        }
        .square {
            width: 100%;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            position: relative;
        }
        .chess-piece {
            display: block;
            width: 86%;
            height: 86%;
            pointer-events: none;
            filter: var(--piece-shadow);
        }
        .piece-animating {
            transition: transform 200ms ease-out;
            z-index: 10;
            position: relative;
        }
        .piece-captured {
            transition: opacity 200ms ease-out;
            opacity: 0;
            z-index: 5;
            position: relative;
        }
        @media (prefers-reduced-motion: reduce) {
            .piece-animating { transition: none !important; }
            .piece-captured { transition: none !important; }
            /* A7: keep shadow static (no transition) under reduced motion */
            .chess-piece { filter: var(--piece-shadow); }
        }
        .white-sq { background-color: var(--sq-white); background-image: var(--sq-white-grad); }
        .black-sq { background-color: var(--sq-black); background-image: var(--sq-black-grad); }
        .highlight { background-color: var(--highlight) !important; background-image: none !important; }
        /* A3: chess-standard legal-move indicators. Quiet moves show a small
           centered dot via ::after; captures show a ring around the piece. */
        .legal-move::after {
            content: '';
            position: absolute;
            width: 30%;
            height: 30%;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.22);
            pointer-events: none;
        }
        .legal-capture::after {
            content: '';
            position: absolute;
            inset: 6%;
            border-radius: 50%;
            border: 4px solid rgba(0, 0, 0, 0.22);
            box-sizing: border-box;
            pointer-events: none;
        }
        @media (prefers-reduced-motion: reduce) {
            .legal-move::after,
            .legal-capture::after { transition: none !important; }
        }
        .king-in-check, .king-mate {
            box-shadow: inset 0 0 0 4px #d97706, 0 0 10px rgba(217, 119, 6, 0.85);
        }
        .king-mate {
            box-shadow: inset 0 0 0 4px #dc2626, 0 0 12px rgba(220, 38, 38, 0.9);
        }
        .drop-hint {
            box-shadow: inset 0 0 0 4px #2563eb, 0 0 12px rgba(37, 99, 235, 0.65);
            background-color: var(--drop-hint-bg) !important;
        }
        .dragging-source {
            opacity: 0.4;
        }
        .square[draggable="true"] {
            cursor: grab;
        }
        .square[draggable="true"]:active {
            cursor: grabbing;
        }
        #board-shell {
            display: grid;
            grid-template-columns: 1.5em auto;
            grid-template-rows: auto 1.5em;
            align-items: stretch;
        }
        #rank-labels, #file-labels {
            color: var(--label-color);
            font-size: 0.8em;
            font-weight: bold;
            user-select: none;
        }
        #rank-labels {
            display: grid;
            grid-template-rows: repeat(8, 1fr);
            align-items: center;
            justify-items: center;
        }
        #file-labels {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            align-items: center;
            justify-items: center;
        }
        #status-panel {
            margin-top: 20px;
            text-align: center;
        }
        #timers {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 10px;
        }
        .timer-badge {
            padding: 5px 10px;
            border: 2px solid var(--timer-border);
            border-radius: 4px;
            font-weight: bold;
        }
        .active-timer {
            background-color: var(--active-timer-bg);
            border-color: var(--active-timer-border);
        }
        /* A8: low-time warning. Pulsing red style applied to the active
           player's clock when their interpolated time drops below 60s.
           Honors prefers-reduced-motion: the animation is suppressed and the
           element falls back to a static red style. */
        .low-time {
            color: #dc2626;
            border-color: #dc2626;
            animation: low-time-pulse 1s ease-in-out infinite;
        }
        @keyframes low-time-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.0); }
            50% { box-shadow: 0 0 8px 3px rgba(220, 38, 38, 0.65); }
        }
        @media (prefers-reduced-motion: reduce) {
            .low-time {
                animation: none;
                box-shadow: inset 0 0 0 2px rgba(220, 38, 38, 0.55);
            }
        }
        .player-tray {
            min-width: 120px;
            font-size: 0.85em;
            text-align: center;
        }
        .captured-pieces {
            min-height: 1.2em;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2px;
        }
        .captured-pieces .chess-piece {
            width: 1.2em;
            height: 1.2em;
        }
        #material-advantage {
            margin-top: 5px;
            font-weight: bold;
        }
        #history-container {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            width: 300px;
            border: 1px solid var(--panel-border);
            background: var(--panel-bg);
            color: var(--text-color);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 5px;
            text-align: center;
            border-bottom: 1px solid var(--panel-row-border);
            font-size: 0.9em;
        }
        button {
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
        }
        #promo-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        #promo-modal.hidden {
            display: none;
        }
        #promo-box {
            background: var(--modal-bg);
            border: 2px solid var(--modal-border);
            border-radius: 6px;
            padding: 16px;
            text-align: center;
            color: var(--text-color);
        }
        #promo-title {
            font-weight: bold;
            margin-bottom: 10px;
        }
        #promo-choices {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .promo-btn {
            padding: 8px 12px;
        }
        .promo-btn .chess-piece {
            width: 45px;
            height: 45px;
        }
        #promo-cancel {
            margin-top: 12px;
        }
        #game-end-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--overlay-bg);
            z-index: 200;
        }
        #game-end-overlay.hidden { display: none; }
        #game-end-card {
            min-width: min(80vw, 360px);
            padding: 28px;
            text-align: center;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-color);
        }
        #game-end-banner { margin: 0 0 18px; }

        /* A6: Theme selector bar */
        #theme-bar {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.85em;
        }
        #theme-bar label {
            font-weight: bold;
        }
        #theme-board-select, #theme-mode-toggle {
            padding: 4px 8px;
            font-size: 0.9em;
        }
        #theme-mode-toggle {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Chess UI</h1>
    <div id="theme-bar">
        <label for="theme-board-select">Board:</label>
        <select id="theme-board-select">
            <option value="classic">Classic</option>
            <option value="classic-dark">Classic Dark</option>
            <option value="slate">Slate</option>
            <option value="walnut">Walnut</option>
            <option value="colorblind">Colorblind-Safe</option>
            <option value="colorblind-dark">Colorblind-Safe (Dark)</option>
        </select>
        <button id="theme-mode-toggle">Dark mode</button>
    </div>
    <div id="game-container">
        <div id="board-shell">
            <div id="rank-labels" aria-hidden="true"></div>
            <div id="board"></div>
            <div></div>
            <div id="file-labels" aria-hidden="true"></div>
        </div>
        <div id="timers">
            <div class="player-tray">
                <div id="timer-white" class="timer-badge">White: 10:00</div>
                <div>White captured</div>
                <div id="captured-white" class="captured-pieces">—</div>
            </div>
            <div class="player-tray">
                <div id="timer-black" class="timer-badge">Black: 10:00</div>
                <div>Black captured</div>
                <div id="captured-black" class="captured-pieces">—</div>
            </div>
        </div>
        <div id="material-advantage">Material even</div>
    </div>
    <div id="status-panel">
        <div id="info">Turn: White</div>
        <div id="status">Status: Ongoing</div>
        <br>
        <button id="new-game">New Game</button>
        <button id="copy-pgn">Copy PGN</button>
        <button id="flip-board">Flip</button>
        <button id="resign">Resign</button>
        <button id="offer-draw">Draw</button>
        <button id="undo">Undo</button>
    </div>
    <div id="history-container">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>White Move</th>
                    <th>Black Move</th>
                </tr>
            </thead>
            <tbody id="history-body"></tbody>
        </table>
    </div>
    <div id="promo-modal" class="hidden">
        <div id="promo-box">
            <div id="promo-title">Promote to</div>
            <div id="promo-choices">
                <button class="promo-btn" data-piece="q"></button>
                <button class="promo-btn" data-piece="r"></button>
                <button class="promo-btn" data-piece="b"></button>
                <button class="promo-btn" data-piece="n"></button>
            </div>
            <button id="promo-cancel">Cancel</button>
        </div>
    </div>
    <div id="game-end-overlay" class="hidden" role="dialog" aria-live="polite">
        <div id="game-end-card">
            <h2 id="game-end-banner"></h2>
            <button id="rematch">Rematch</button>
        </div>
    </div>
    <script src="engine.js"></script>
    <script src="pieces.js"></script>
    <script src="ui.js"></script>
</body>
</html>
