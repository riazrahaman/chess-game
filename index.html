<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess UI</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
        }
        #game-container {
            margin-top: 20px;
        }
        #board {
            display: grid;
            width: min(calc(100vw - 2.5em), 640px);
            aspect-ratio: 1;
            grid-template-columns: repeat(8, minmax(0, 1fr));
            grid-template-rows: repeat(8, minmax(0, 1fr));
            border: 2px solid #333;
        }
        .square {
            width: 100%;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        .chess-piece {
            display: block;
            width: 86%;
            height: 86%;
            pointer-events: none;
        }
        .white-sq { background-color: #eeeed2; }
        .black-sq { background-color: #769656; }
        .highlight { background-color: #f7f769 !important; }
        .king-in-check, .king-mate {
            box-shadow: inset 0 0 0 4px #d97706, 0 0 10px rgba(217, 119, 6, 0.85);
        }
        .king-mate {
            box-shadow: inset 0 0 0 4px #dc2626, 0 0 12px rgba(220, 38, 38, 0.9);
        }
        .drop-hint {
            box-shadow: inset 0 0 0 4px #2563eb, 0 0 12px rgba(37, 99, 235, 0.65);
            background-color: #bcd4ff !important;
        }
        .dragging-source {
            opacity: 0.4;
        }
        .square[draggable="true"] {
            cursor: grab;
        }
        .square[draggable="true"]:active {
            cursor: grabbing;
        }
        #board-shell {
            display: grid;
            grid-template-columns: 1.5em auto;
            grid-template-rows: auto 1.5em;
            align-items: stretch;
        }
        #rank-labels, #file-labels {
            color: #333;
            font-size: 0.8em;
            font-weight: bold;
            user-select: none;
        }
        #rank-labels {
            display: grid;
            grid-template-rows: repeat(8, 1fr);
            align-items: center;
            justify-items: center;
        }
        #file-labels {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            align-items: center;
            justify-items: center;
        }
        #status-panel {
            margin-top: 20px;
            text-align: center;
        }
        #timers {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 10px;
        }
        .timer-badge {
            padding: 5px 10px;
            border: 2px solid #333;
            border-radius: 4px;
            font-weight: bold;
        }
        .active-timer {
            background-color: #f7f769;
            border-color: #ffcc00;
        }
        .player-tray {
            min-width: 120px;
            font-size: 0.85em;
            text-align: center;
        }
        .captured-pieces {
            min-height: 1.2em;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2px;
        }
        .captured-pieces .chess-piece {
            width: 1.2em;
            height: 1.2em;
        }
        #material-advantage {
            margin-top: 5px;
            font-weight: bold;
        }
        #history-container {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            width: 300px;
            border: 1px solid #ccc;
            background: white;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 5px;
            text-align: center;
            border-bottom: 1px solid #ddd;
            font-size: 0.9em;
        }
        button {
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
        }
        #promo-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        #promo-modal.hidden {
            display: none;
        }
        #promo-box {
            background: white;
            border: 2px solid #333;
            border-radius: 6px;
            padding: 16px;
            text-align: center;
        }
        #promo-title {
            font-weight: bold;
            margin-bottom: 10px;
        }
        #promo-choices {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .promo-btn {
            padding: 8px 12px;
        }
        .promo-btn .chess-piece {
            width: 45px;
            height: 45px;
        }
        #promo-cancel {
            margin-top: 12px;
        }
        #game-end-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(17, 24, 39, 0.7);
            z-index: 200;
        }
        #game-end-overlay.hidden { display: none; }
        #game-end-card {
            min-width: min(80vw, 360px);
            padding: 28px;
            text-align: center;
            background: white;
            border: 2px solid #333;
            border-radius: 8px;
        }
        #game-end-banner { margin: 0 0 18px; }
    </style>
</head>
<body>
    <h1>Chess UI</h1>
    <div id="game-container">
        <div id="board-shell">
            <div id="rank-labels" aria-hidden="true"></div>
            <div id="board"></div>
            <div></div>
            <div id="file-labels" aria-hidden="true"></div>
        </div>
        <div id="timers">
            <div class="player-tray">
                <div id="timer-white" class="timer-badge">White: 10:00</div>
                <div>White captured</div>
                <div id="captured-white" class="captured-pieces">—</div>
            </div>
            <div class="player-tray">
                <div id="timer-black" class="timer-badge">Black: 10:00</div>
                <div>Black captured</div>
                <div id="captured-black" class="captured-pieces">—</div>
            </div>
        </div>
        <div id="material-advantage">Material even</div>
    </div>
    <div id="status-panel">
        <div id="info">Turn: White</div>
        <div id="status">Status: Ongoing</div>
        <br>
        <button id="new-game">New Game</button>
        <button id="copy-pgn">Copy PGN</button>
        <button id="flip-board">Flip</button>
        <button id="resign">Resign</button>
        <button id="offer-draw">Draw</button>
        <button id="undo">Undo</button>
    </div>
    <div id="history-container">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>White Move</th>
                    <th>Black Move</th>
                </tr>
            </thead>
            <tbody id="history-body"></tbody>
        </table>
    </div>
    <div id="promo-modal" class="hidden">
        <div id="promo-box">
            <div id="promo-title">Promote to</div>
            <div id="promo-choices">
                <button class="promo-btn" data-piece="q"></button>
                <button class="promo-btn" data-piece="r"></button>
                <button class="promo-btn" data-piece="b"></button>
                <button class="promo-btn" data-piece="n"></button>
            </div>
            <button id="promo-cancel">Cancel</button>
        </div>
    </div>
    <div id="game-end-overlay" class="hidden" role="dialog" aria-live="polite">
        <div id="game-end-card">
            <h2 id="game-end-banner"></h2>
            <button id="rematch">Rematch</button>
        </div>
    </div>
    <script src="engine.js"></script>
    <script src="pieces.js"></script>
    <script src="ui.js"></script>
</body>
</html>
